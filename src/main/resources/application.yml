spring:
  application:
    name: url-shortener

  datasource:
    url: jdbc:h2:file:./data/urlshortener;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: shortUrls
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=10m

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

app:
  base-url: http://localhost:8080
  short-code-length: 7
  collision-retries: 5