spring:
  datasource:
    url: jdbc:h2:mem:urlshortener-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cache:
    type: caffeine
    cache-names: shortUrls
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1m

app:
  base-url: http://localhost:8080
  short-code-length: 7
  collision-retries: 5